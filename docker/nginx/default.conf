server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta no encontrada en disco devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Longitud máxima de body para las rutas del chat
    client_max_body_size 10m;

    # Proxy del API Laravel (contenedor "app")
    location /api/ {
        proxy_pass http://app:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Archivos estáticos con caché larga (los assets de Vite llevan hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Muestra versión y estado básico para monitoreo
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}