services:
  app:
    build:
      context: ./
      dockerfile: docker/app/Dockerfile
    image: catalogo-backend
    container_name: catalogo_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-catalogo}
      DB_USERNAME: ${DB_USERNAME:-catalogo}
      DB_PASSWORD: ${DB_PASSWORD:-catalogo_secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - catalogo_net

  worker:
    image: catalogo-backend
    container_name: catalogo_worker
    depends_on:
      - app
      - redis
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-catalogo}
      DB_USERNAME: ${DB_USERNAME:-catalogo}
      DB_PASSWORD: ${DB_PASSWORD:-catalogo_secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - catalogo_net

  nginx:
    build:
      context: ./
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
    image: catalogo-frontend
    container_name: catalogo_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - app
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - catalogo_net

  postgres:
    image: postgres:16-alpine
    container_name: catalogo_postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-catalogo}
      POSTGRES_USER: ${DB_USERNAME:-catalogo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-catalogo_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-catalogo} -d ${DB_DATABASE:-catalogo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - catalogo_net

  redis:
    image: redis:7-alpine
    container_name: catalogo_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - catalogo_net

  migrate:
    image: catalogo-backend
    container_name: catalogo_migrate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "php artisan migrate --force && php artisan db:seed --force"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-catalogo}
      DB_USERNAME: ${DB_USERNAME:-catalogo}
      DB_PASSWORD: ${DB_PASSWORD:-catalogo_secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - catalogo_net

networks:
  catalogo_net:
    driver: bridge

volumes:
  storage_data:
  postgres_data:
  redis_data: